[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
timeout = 30
interpreter_python = /usr/bin/python3
forks = 20

[ssh_connection]
# Reuse one SSH connection per host (multiplexing) + keepalives + retries, so a
# slow/booting VM doesn't drop mid-play. Avoids reconnect flakiness and timeouts.
ssh_args = -o ControlMaster=auto -o ControlPersist=180s -o ServerAliveInterval=15 -o ServerAliveCountMax=6 -o ConnectTimeout=30 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
pipelining = True
retries = 3
