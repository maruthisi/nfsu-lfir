#cloud-config
# Source node: nginx installed at boot, serving /var/data (where the payload it
# sends is stored). The file-drop sender is deployed later by the Ansible playbook.
package_update: true
packages:
  - nginx

write_files:
  - path: /etc/nginx/sites-available/lfir
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;
          root /var/data;
          location / {
              autoindex on;
              autoindex_exact_size off;
              autoindex_localtime on;
          }
      }

runcmd:
  - install -d -m 755 /var/data
  - rm -f /etc/nginx/sites-enabled/default
  - ln -sf /etc/nginx/sites-available/lfir /etc/nginx/sites-enabled/lfir
  - systemctl enable --now nginx
  - systemctl restart nginx
